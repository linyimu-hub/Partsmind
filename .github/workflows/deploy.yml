# deploy.yml — triggered only on push to main after CI passes
# Builds Docker images, pushes to registry, deploys to Railway

name: Deploy to Production

on:
  push:
    branches: [main]

# Prevent concurrent deploys — if a new push comes while deploying,
# cancel the in-progress deploy and start fresh
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  # ── Gate: must pass CI first ────────────────────────────────────
  ci-gate:
    name: Verify CI passed
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # ── Build + push Docker images ──────────────────────────────────
  build:
    name: Build Docker images
    needs: ci-gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./infra/docker/Dockerfile.backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./infra/docker/Dockerfile.frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}

  # ── Deploy to Railway ───────────────────────────────────────────
  deploy:
    name: Deploy to Railway
    needs: build
    runs-on: ubuntu-latest
    environment: production    # requires manual approval in GitHub settings

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Run DB migrations
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway run --service backend \
            python -m alembic upgrade head

      - name: Deploy backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service backend --detach

      - name: Deploy worker
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service worker --detach

      - name: Deploy frontend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service frontend --detach

      - name: Health check
        run: |
          echo "Waiting for services to start..."
          sleep 30
          curl -f ${{ secrets.PRODUCTION_URL }}/health || exit 1
          echo "✅ Production health check passed"

      - name: Notify deployment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}' === 'success' ? '✅' : '❌';
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `${status} Deployment to production: ${{ job.status }}\nCommit: ${{ github.sha }}`
            });
