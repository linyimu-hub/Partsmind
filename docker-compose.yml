version: "3.9"

services:
  # ─── PostgreSQL + pgvector ───────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-partsmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-partsmind_dev}
      POSTGRES_DB: ${POSTGRES_DB:-partsmind}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-partsmind}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis (cache + Celery broker) ───────────────────────
  redis:
    image: redis:7-alpine
    #ports:
      #- "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── FastAPI backend ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: ../infra/docker/Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-partsmind}:${POSTGRES_PASSWORD:-partsmind_dev}@db:5432/${POSTGRES_DB:-partsmind}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ─── Celery worker (async document processing) ────────────
  worker:
    build:
      context: ./backend
      dockerfile: ../infra/docker/Dockerfile.backend
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-partsmind}:${POSTGRES_PASSWORD:-partsmind_dev}@db:5432/${POSTGRES_DB:-partsmind}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2

  # ─── Next.js frontend ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: ../infra/docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  uploads_data:
