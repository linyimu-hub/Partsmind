# PartsMind — Nginx reverse proxy configuration
# Handles: SSL termination (via Railway), rate limiting, gzip, routing

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ─────────────────────────────────────────────────
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"bytes":$body_bytes_sent,'
            '"latency_ms":$request_time,'
            '"ip":"$remote_addr",'
            '"ua":"$http_user_agent"'
        '}';
    access_log /var/log/nginx/access.log json_combined;

    # ── Performance ──────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    gzip               on;
    gzip_vary          on;
    gzip_min_length    1024;
    gzip_types         text/plain text/css application/json
                       application/javascript text/xml application/xml;

    # ── Rate limiting ────────────────────────────────────────────
    # Zone for general API: 30 requests/minute per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
    # Stricter zone for auth endpoints: 10 requests/minute per IP
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

    # ── Upstream services ────────────────────────────────────────
    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend {
        server frontend:3000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options          "SAMEORIGIN"   always;
        add_header X-Content-Type-Options   "nosniff"      always;
        add_header X-XSS-Protection         "1; mode=block" always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy       "camera=(), microphone=()" always;

        # ── API routes ────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            # Timeouts: generous for agent responses (can take 5-10s)
            proxy_connect_timeout  10s;
            proxy_send_timeout     60s;
            proxy_read_timeout     60s;

            # Upload size: allow up to 55MB (matches MAX_UPLOAD_SIZE_MB=50)
            client_max_body_size 55M;
        }

        # Stricter rate limit for auth endpoints
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Health check (no rate limit, used by Railway)
        location /health {
            proxy_pass http://backend/health;
            access_log off;
        }

        # ── Frontend routes ────────────────────────────────────────
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";

            # Next.js static assets — long cache
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
                proxy_pass http://frontend;
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # Block common attack paths
        location ~ /\. { deny all; }
        location ~ \.(env|git|sql)$ { deny all; }
    }
}
